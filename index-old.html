<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15803d"><title>Fresh Vegetable</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6faf5;color:#18351f}.top{background:#0f6d38;color:#fff;padding:10px 14px;text-align:center;font-size:14px}.nav{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}.brand{font-size:22px;font-weight:800;color:#13743c}.cartpill{background:#e9f7ed;padding:9px 12px;border-radius:24px;font-weight:700}.hero{margin:14px;border-radius:22px;padding:28px 20px;background:linear-gradient(135deg,#dff6df,#f6ffe9);box-shadow:0 6px 22px #0000000d}.hero h1{font-size:32px;line-height:1.08;margin:0 0 10px}.hero p{margin:7px 0;color:#45624b}.cta{display:inline-block;margin-top:10px;background:#15803d;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:800}.section{padding:6px 14px 110px}.section h2{margin:14px 2px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:1000px;margin:auto}.card{background:#fff;border-radius:18px;padding:11px;box-shadow:0 4px 18px #0000000d;border:1px solid #edf3ed}.pic{height:110px;border-radius:14px;background:#eef8eb;display:flex;align-items:center;justify-content:center;font-size:64px}.name{font-weight:800;font-size:17px;margin:10px 0 4px}.price{color:#15803d;font-weight:800}.unit{font-size:12px;color:#708075}.qty{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:#f3f7f2;border-radius:10px;padding:4px}.qty button{width:34px;height:34px;border:0;border-radius:8px;background:#fff;font-size:20px;font-weight:800}.add{width:100%;margin-top:8px;border:0;border-radius:10px;padding:10px;background:#15803d;color:#fff;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -5px 20px #0002;z-index:10}.wa{border:0;border-radius:12px;background:#25D366;color:#fff;padding:13px 15px;font-weight:800}.total{font-weight:800}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px}.feature{background:#fff;text-align:center;border-radius:14px;padding:12px 6px;box-shadow:0 3px 12px #0001;font-size:12px}.feature b{display:block;font-size:22px;margin-bottom:5px}@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.hero{max-width:1000px;margin:18px auto}.features{max-width:1000px;margin:14px auto}.section{max-width:1030px;margin:auto}}
</style></head><body>
<div class="top">🚚 5 KM পর্যন্ত No Delivery Charge • Fresh • Safe • Reliable</div>
<div class="nav"><div class="brand">🌿 Fresh Vegetable</div><div class="cartpill" id="navcart">🛒 0</div></div>
<section class="hero"><h1>Fresh vegetables,<br>delivered to your door.</h1><p>প্রতিদিনের তাজা সবজি সহজে অর্ডার করুন।</p><p>📱 WhatsApp: 6290796633</p><button class="cta" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Now</button></section>
<div class="features"><div class="feature"><b>🌱</b>Fresh Daily</div><div class="feature"><b>🚚</b>Home Delivery</div><div class="feature"><b>💬</b>WhatsApp Order</div></div>
<section class="section" id="shop"><h2>🥬 Fresh Vegetables</h2><div class="products" id="products"></div></section>
<div class="bottom"><div><div id="items">0 items</div><div class="total" id="total">₹0</div></div><button class="wa" onclick="orderNow()">WhatsApp Order</button></div>
<script>
const products=[["Potato",30,"kg","🥔"],["Tomato",40,"kg","🍅"],["Onion",35,"kg","🧅"],["Carrot",60,"kg","🥕"],["Brinjal",45,"kg","🍆"],["Cauliflower",50,"pc","🥦"],["Cabbage",35,"pc","🥬"],["Capsicum",80,"kg","🫑"],["Green Chilli",80,"kg","🌶️"],["Cucumber",40,"kg","🥒"],["Garlic",160,"kg","🧄"],["Mushroom",60,"pack","🍄"],["Corn",40,"pc","🌽"],["Spinach",20,"bunch","🥬"],["Coriander",10,"bunch","🌿"],["Pumpkin",40,"kg","🎃"]].map(x=>({name:x[0],price:x[1],unit:x[2],emoji:x[3]}));let cart={};
function render(){document.getElementById('products').innerHTML=products.map((p,i)=>`<article class="card"><div class="pic">${p.emoji}</div><div class="name">${p.name}</div><div><span class="price">₹${p.price}</span> <span class="unit">/ ${p.unit}</span></div><div class="qty"><button onclick="change(${i},-1)">−</button><b id="q${i}">${cart[i]||0}</b><button onclick="change(${i},1)">+</button></div><button class="add" onclick="change(${i},1)">Add to Cart</button></article>`).join('');update()}
function change(i,n){cart[i]=Math.max(0,(cart[i]||0)+n);document.getElementById('q'+i).textContent=cart[i];update()}
function update(){let c=0,t=0;Object.keys(cart).forEach(i=>{c+=cart[i];t+=cart[i]*products[i].price});document.getElementById('items').textContent=c+' items';document.getElementById('navcart').textContent='🛒 '+c;document.getElementById('total').textContent='₹'+t}
function orderNow(){let rows=[],t=0;Object.keys(cart).forEach(i=>{let q=cart[i];if(q){let p=products[i],a=q*p.price;t+=a;rows.push('• '+p.name+' x '+q+' = ₹'+a)}});if(!rows.length){alert('Please add vegetables to cart first.');return}let m='Hello Fresh Vegetable, I want to order:\n\n'+rows.join('\n')+'\n\nTotal: ₹'+t+'\n\nName:\nAddress:';location.href='https://wa.me/916290796633?text='+encodeURIComponent(m)}render();
</script></body></html>
