<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Vegetable Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f2}header{background:#168348;color:white;text-align:center;padding:20px}.box{background:white;margin:16px auto;padding:18px;border-radius:14px;max-width:700px}input,select{width:100%;padding:13px;margin:6px 0;font-size:17px}.row{border-top:1px solid #ddd;padding:14px 0}button{border:0;border-radius:8px;padding:11px 15px;font-size:16px}.green{background:#168348;color:white}.red{background:#c62828;color:white}.actions{display:flex;gap:8px}.status{font-weight:bold;min-height:22px}.stock{display:flex;gap:8px;align-items:center}.stock input{width:auto}</style></head><body><header><h2>🥬 Fresh Vegetable Admin</h2></header><div class="box"><h3>Add New Product</h3><input id="nn" placeholder="Product name"><input id="np" type="number" placeholder="Price"><select id="nu"><option>kg</option><option>pc</option><option>pack</option><option>bunch</option></select><input id="ne" placeholder="Emoji 🥔"><label class="stock"><input id="ns" type="checkbox" checked>In Stock</label><br><button id="add" class="green">Add Product</button><p id="top" class="status"></p></div><div class="box"><h3>Products</h3><p>দাম বদলে Update চাপুন।</p><div id="list">Loading...</div></div><script>
const BASE="https://firestore.googleapis.com/v1/projects/fresh-vegetables-c5c76/databases/(default)/documents/Product";
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const v=f=>f?.stringValue??(f?.integerValue!==undefined?Number(f.integerValue):(f?.doubleValue!==undefined?Number(f.doubleValue):(f?.booleanValue!==undefined?f.booleanValue:"")));
const fields=x=>({name:{stringValue:String(x.name)},price:{doubleValue:Number(x.price)},unit:{stringValue:String(x.unit||"kg")},emoji:{stringValue:String(x.emoji||"🥬")},stock:{booleanValue:!!x.stock}});
async function req(url,opt={}){let r=await fetch(url,opt),t=await r.text(),d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error(d.error?.message||("HTTP "+r.status));return d}
async function load(){try{let d=await req(BASE+"?pageSize=200"),a=d.documents||[];$("list").innerHTML=a.length?a.map(q=>{let f=q.fields||{},id=decodeURIComponent(q.name.split("/").pop()),n=v(f.name)||id,p=v(f.price),u=v(f.unit)||"kg",e=v(f.emoji)||"🥬",s=v(f.stock)!==false;return `<div class="row" data-id="${esc(id)}"><b>${esc(e)} ${esc(n)}</b><input class="nm" value="${esc(n)}"><input class="pr" type="number" value="${esc(p)}"><select class="un">${["kg","pc","pack","bunch"].map(x=>`<option ${x===u?"selected":""}>${x}</option>`).join("")}</select><input class="em" value="${esc(e)}"><label class="stock"><input class="st" type="checkbox" ${s?"checked":""}>In Stock</label><br><div class="actions"><button class="green upd">Update</button><button class="red del">Delete</button></div><p class="status msg"></p></div>`}).join(""):"No products yet."}catch(e){$("list").innerHTML="<p class=status>❌ "+esc(e.message)+"</p>"}}
$("list").onclick=async e=>{let r=e.target.closest(".row");if(!r)return;let m=r.querySelector(".msg"),id=r.dataset.id;if(e.target.classList.contains("upd")){let x={name:r.querySelector(".nm").value.trim(),price:r.querySelector(".pr").value,unit:r.querySelector(".un").value,emoji:r.querySelector(".em").value||"🥬",stock:r.querySelector(".st").checked};m.textContent="Saving...";try{await req(BASE+"/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fields(x)})});m.textContent="✅ Updated successfully"}catch(z){m.textContent="❌ "+z.message}}if(e.target.classList.contains("del")){if(!confirm("Delete this product?"))return;try{await req(BASE+"/"+encodeURIComponent(id),{method:"DELETE"});await load()}catch(z){m.textContent="❌ "+z.message}}};
$("add").onclick=async()=>{let x={name:$("nn").value.trim(),price:$("np").value,unit:$("nu").value,emoji:$("ne").value||"🥬",stock:$("ns").checked};if(!x.name||x.price===""){ $("top").textContent="❌ Name and price required";return}$("top").textContent="Saving...";try{await req(BASE+"/"+encodeURIComponent(x.name.replace(/[\/#?]/g,"-")),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:fields(x)})});$("top").textContent="✅ Product saved";await load()}catch(e){$("top").textContent="❌ "+e.message}};
load();</script></body></html>
