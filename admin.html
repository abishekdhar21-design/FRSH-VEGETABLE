<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresh Vegetable Admin</title><style>body{font-family:Arial;background:#f4f7f2;margin:0}header{background:#168348;color:white;text-align:center;padding:16px}.box{background:white;margin:14px;padding:15px;border-radius:12px}input,select{width:100%;padding:11px;margin:6px 0;box-sizing:border-box}.save{background:#168348;color:white;border:0;padding:11px;border-radius:8px}.del{background:#c62828;color:white;border:0;padding:8px;border-radius:8px}.item{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #ddd}</style></head><body><header><h2>🥬 Fresh Vegetable Admin</h2></header><div class="box"><h3>Add / Update Product</h3><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price"><select id="unit"><option>kg</option><option>pc</option><option>pack</option><option>bunch</option></select><input id="emoji" placeholder="Emoji 🥔"><label><input id="stock" type="checkbox" checked style="width:auto"> In Stock</label><br><br><button id="save" class="save">Save Product</button><p id="status"></p></div><div class="box"><h3>Products</h3><div id="list">Loading...</div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js';import{getFirestore,collection,onSnapshot,doc,setDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyDid8kMizol8IuKas7t-5GGOGKdB-HZFoA',authDomain:'fresh-vegetables-c5c76.firebaseapp.com',projectId:'fresh-vegetables-c5c76',storageBucket:'fresh-vegetables-c5c76.firebasestorage.app',messagingSenderId:'833704851091',appId:'1:833704851091:web:2bb80682ea5c36c9b7bf66'};const db=getFirestore(initializeApp(cfg));save.onclick=async()=>{let n=name.value.trim();if(!n||!price.value)return alert('Name and price required');try{await setDoc(doc(db,'Product',n.replace(/[\/#?]/g,'-')),{name:n,price:Number(price.value),unit:unit.value,emoji:emoji.value||'🥬',stock:stock.checked},{merge:true});status.textContent='✅ Saved'}catch(e){status.textContent='❌ Firestore write permission blocked'}};function edit(x){name.value=x.name;price.value=x.price;unit.value=x.unit||'kg';emoji.value=x.emoji||'';stock.checked=x.stock!==false;scrollTo(0,0)}onSnapshot(collection(db,'vegetables'),s=>{list.innerHTML='';s.forEach(d=>{let x={id:d.id,...d.data()},e=document.createElement('div');e.className='item';e.innerHTML='<span><b>'+(x.emoji||'🥬')+' '+x.name+'</b><br>₹'+x.price+' / '+(x.unit||'kg')+'</span><span><button class="save">Edit</button> <button class="del">Delete</button></span>';let b=e.querySelectorAll('button');b[0].onclick=()=>edit(x);b[1].onclick=()=>deleteDoc(doc(db,'vegetables',x.id));list.appendChild(e)})});</script></body></html>
